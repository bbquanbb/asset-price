name: update-prices
on:
  schedule:
    - cron: '*/15 * * * *'   # mỗi 15 phút (có thể trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: Commit nếu giá thay đổi
        run: |
          if [ -n "$(git status --porcelain docs/prices.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add docs/prices.json
            git commit -m "update prices"
            git push
          fi
